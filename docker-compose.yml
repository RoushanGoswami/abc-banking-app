version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: banking_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: BankSecurePassword2026!
      POSTGRES_DB: abc_banking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d abc_banking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
